<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tu mensaje de hoy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: #f5efe3;
      font-family: Arial, sans-serif;
      color: #37402c;
      text-align: center;
    }

    .tarjeta {
      max-width: 500px;
      width: 100%;
      background: #fffaf1;
      padding: 45px 30px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .sol {
      font-size: 45px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 25px;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    #mensaje {
      font-size: 24px;
      line-height: 1.5;
      font-weight: bold;
      margin: 25px 0 35px;
    }

    .final {
      font-size: 16px;
      opacity: 0.75;
    }

    .marca {
      margin-top: 35px;
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0.55;
    }
  </style>
</head>

<body>

  <div class="tarjeta">

    <div class="sol">☀️</div>

    <h1>TU MENSAJE DE HOY</h1>

    <div id="mensaje"></div>

      Que tengas un bonito día
    </div>

    <div class="marca">
      personaliza2s
    </div>

  </div>

    const hoy = new Date();

    const inicio = new Date(
      hoy.getFullYear(),
      0,
      0
    );

    const diferencia = hoy - inicio;

    const diaDelAno = Math.floor(
      diferencia / (1000 * 60 * 60 * 24)
    );

    const numeroMensaje =
      diaDelAno % mensajes.length;

    document.getElementById("mensaje").textContent =
      mensajes[numeroMensaje];

</body>
</html>
