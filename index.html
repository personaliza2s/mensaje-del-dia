<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tu mensaje de hoy | Personaliza2s</title>

    <!-- Montserrat para títulos y marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background: #f7f2ee;

            font-family: Helvetica, Arial, sans-serif;
            color: #2A1E1E;
            text-align: center;
        }

        .contenedor {
            width: 100%;
            max-width: 520px;
        }

        .tarjeta {
            position: relative;
            overflow: hidden;

            background: #fffaf7;
            border-radius: 32px;

            padding: 55px 42px 45px;

            box-shadow:
                0 18px 45px rgba(80, 56, 80, 0.12);

            border: 1px solid rgba(170, 101, 129, 0.12);
        }

        /* Pequeño detalle decorativo superior */

        .detalle {
            width: 58px;
            height: 8px;

            background: #F99FA9;

            border-radius: 20px;

            margin: 0 auto 30px;
        }

        h1 {
            margin: 0 0 35px;

            font-family: "Montserrat", Helvetica, Arial, sans-serif;
            font-size: 25px;
            font-weight: 800;

            letter-spacing: 1.5px;

            color: #503850;
        }

        #mensaje {
            font-family: Helvetica, Arial, sans-serif;

            font-size: 25px;
            line-height: 1.45;
            font-weight: 700;

            color: #2A1E1E;

            margin-bottom: 38px;
        }

        .despedida {
            font-family: Helvetica, Arial, sans-serif;

            font-size: 17px;
            font-weight: 400;

            color: #AA6581;

            margin-bottom: 32px;
        }

        .marca {
            font-family: "Montserrat", Helvetica, Arial, sans-serif;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 3px;

            color: #503850;

            text-transform: uppercase;
        }

        /* Detalles inferiores */

        .puntos {
            display: flex;
            justify-content: center;
            gap: 7px;

            margin-top: 18px;
        }

        .punto {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #AA6581;
        }

        .punto.centro {
            background: #F99FA9;
        }

        @media (max-width: 480px) {

            body {
                padding: 18px;
            }

            .tarjeta {
                padding: 45px 25px 38px;
                border-radius: 26px;
            }

            h1 {
                font-size: 21px;
                margin-bottom: 30px;
            }

            #mensaje {
                font-size: 22px;
            }

            .despedida {
                font-size: 16px;
            }
        }

    </style>
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <div class="detalle"></div>

            <h1>TU MENSAJE DE HOY</h1>

            <div id="mensaje"></div>

            <div class="despedida">
                Que tengas un bonito día
            </div>

            <div class="marca">
                PERSONALIZA2S
            </div>

            <div class="puntos">
                <span class="punto"></span>
                <span class="punto centro"></span>
                <span class="punto"></span>
            </div>

        </section>

    </main>


    <script>

        const mensajes = [

            "No necesitas tenerlo todo resuelto. Solo dar el siguiente paso.",
            "Hoy también es un buen día para empezar de nuevo.",
            "Haz algo hoy que tu yo de mañana agradezca.",
            "No todo tiene que ser perfecto para ser bonito.",
            "Ve a tu ritmo. Sigue siendo avanzar.",
            "Confía un poco más en todo lo que ya has superado.",
            "A veces avanzar también significa descansar.",
            "Lo pequeño también cuenta.",
            "No compares tu camino con el de los demás.",
            "Hoy puede ser un día sencillo y aun así ser un buen día.",

            "No necesitas correr. Solo necesitas continuar.",
            "Celebra también las pequeñas victorias.",
            "Tu progreso no siempre será visible, pero sigue siendo progreso.",
            "Hay días para avanzar y días para recuperar fuerzas.",
            "No subestimes todo lo que puedes conseguir poco a poco.",
            "Haz espacio para las cosas que te hacen bien.",

            "Descansar también forma parte del camino.",
            "No todos los días tienen que ser extraordinarios.",
            "Agradece lo que tienes sin dejar de trabajar por lo que quieres.",
            "Un pequeño cambio puede comenzar un gran camino.",
            "Haz más espacio para lo que te da tranquilidad.",
            "No necesitas saber exactamente cómo terminará para comenzar.",

            "Hoy elige algo que te haga sentir bien.",
            "A veces la mejor decisión es simplificar.",
            "No olvides disfrutar mientras construyes lo que quieres.",
            "Tu ritmo también es válido.",
            "No todo merece tu energía.",
            "Deja un poco de espacio para las sorpresas.",
            "Lo estás haciendo mejor de lo que algunos días parece.",
            "Empieza con lo que tienes.",
            "No necesitas permiso para cambiar de opinión.",
            "Las pequeñas decisiones también cambian vidas.",

            "Haz hoy una cosa que llevas demasiado tiempo posponiendo.",
            "No tengas tanta prisa por llegar que olvides mirar alrededor.",
            "Cada etapa tiene algo que enseñarte.",
            "También se vale cambiar de plan.",
            "Tu tranquilidad también es una prioridad.",
            "No todo lo importante hace ruido.",
            "Hoy intenta disfrutar de algo cotidiano.",
            "Un mal momento no convierte todo el día en un mal día.",
            "De vez en cuando mira atrás para recordar cuánto has avanzado.",
            "No necesitas hacerlo todo hoy.",

            "Haz lo que puedas con el día que tienes.",
            "La constancia suele llegar más lejos que la prisa.",
            "No confundas ir despacio con estar detenido.",
            "Date crédito por las cosas que antes te parecían difíciles.",
            "Hoy también cuenta.",
            "No necesitas una ocasión especial para hacer algo bonito.",
            "Algunas respuestas aparecen cuando dejamos de perseguirlas.",
            "No olvides reservar tiempo para vivir.",

            "Haz sitio para nuevas ideas.",

            "Hoy puede sorprenderte.",
            "No necesitas empezar el lunes. Puedes empezar hoy.",

            "No olvides reconocer tus propios esfuerzos.",
            "Haz más de aquello que te hace perder la noción del tiempo.",
            "Una pausa no borra tu progreso.",

            "No tengas miedo de hacer las cosas de una manera diferente.",
            "Hoy intenta preocuparte un poco menos por lo que no puedes controlar.",
            "Los días tranquilos también son parte de una buena vida.",
            "No necesitas tener todas las respuestas.",
            "Deja espacio para cambiar, aprender y volver a intentarlo.",
            "Las cosas sencillas también pueden hacerte feliz.",
            "Hoy busca un motivo pequeño para sonreír.",
            "No esperes a tenerlo todo para disfrutar de lo que ya tienes.",
            "A veces lo mejor empieza sin grandes planes.",
            "Los días normales también terminan convirtiéndose en recuerdos.",

            "Si hoy todo se complica, empieza por hacerte un café.",
            "Respira profundamente. Luego ya vemos qué hacemos con el resto.",
            "No tienes que conquistar el mundo antes de cenar.",
            "Hoy sonríe aunque sea porque encontraste algo rico en la nevera.",
            "Hay problemas que parecen menos graves después de comer.",
            "No dejes para mañana la siesta que puedas echarte hoy.",
            "La vida es demasiado corta para guardar la vajilla bonita.",
            "Si el plan falla, siempre podemos improvisar.",
            "Hoy intenta no discutir con tu despertador.",
            "Una buena merienda también puede arreglar una tarde.",

            "No todo se soluciona con café, pero podemos empezar por ahí.",
            "Si necesitas una señal para descansar cinco minutos, es esta.",
            "Hoy haz algo productivo. Luego celébralo como si hubiera sido muchísimo.",
            "Recuerda beber agua. El café no cuenta como agua.",
            "No necesitas ser adulto responsable las veinticuatro horas.",
            "Hoy intenta reírte incluso de tus propios planes.",
            "A veces la solución es dormir y volver a intentarlo mañana.",
            "No te tomes la vida demasiado en serio. Nadie sale de ella con experiencia previa.",
            "Haz lo mejor que puedas y luego ve a buscar algo rico.",
            "Hoy recuerda: tú también eres una de tus prioridades."

        ];


        /* Calcula el día del año */

        const hoy = new Date();

        const inicio = new Date(
            hoy.getFullYear(),
            0,
            0
        );

        const diferencia = hoy - inicio;

        const diaDelAno = Math.floor(
            diferencia / (1000 * 60 * 60 * 24)
        );


        /* Selecciona el mensaje del día */

        const numeroMensaje =
            diaDelAno % mensajes.length;


        document.getElementById("mensaje").textContent =
            mensajes[numeroMensaje];

    </script>

</body>
</html>
